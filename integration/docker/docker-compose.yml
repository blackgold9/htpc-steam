version: '3.8'
services:
  integration:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: uc-intg-steamos
    restart: unless-stopped
    # Host networking is required, not optional: the driver advertises itself
    # to the Remote via mDNS (see ucapi.IntegrationAPI.init()), and mDNS
    # multicast doesn't traverse Docker's default bridge network. Without
    # this, the integration will never be auto-discovered. See
    # docs/command-mapping.md / the Phase 5 UC3-pairing runbook for details.
    network_mode: host
    volumes:
      - ./data:/config
    environment:
      - UC_CONFIG_HOME=/config
      - UC_INTEGRATION_INTERFACE=0.0.0.0
      - UC_INTEGRATION_HTTP_PORT=9090
      - UC_DISABLE_MDNS_PUBLISH=false
